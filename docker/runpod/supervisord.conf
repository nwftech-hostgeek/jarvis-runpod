[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
user=root

[program:tailscaled]
priority=10
command=/usr/local/bin/tailscaled --tun=userspace-networking --state=%(ENV_TS_STATE_DIR)s/tailscaled.state --socket=%(ENV_TS_SOCKET)s --socks5-server=127.0.0.1:1055 --outbound-http-proxy-listen=127.0.0.1:1055
user=root
autostart=true
autorestart=true
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:tailscale-up]
priority=20
command=/usr/local/bin/tailscale-up.sh
user=root
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:llama]
priority=30
command=/usr/local/bin/llama-entrypoint.sh
directory=%(ENV_RUNPOD_DATA_ROOT)s/models
user=%(ENV_JARVIS_SERVICE_USER)s
environment=HOME="/home/jarvis",HF_HOME="%(ENV_RUNPOD_DATA_ROOT)s/models/.cache/huggingface",HF_XET_HIGH_PERFORMANCE="1"
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:voice]
priority=30
command=/opt/speaches/.venv/bin/uvicorn --factory --host 127.0.0.1 --port 8000 speaches.main:create_app
directory=/opt/speaches
user=%(ENV_JARVIS_SERVICE_USER)s
environment=HOME="/home/jarvis",HF_HOME="%(ENV_RUNPOD_DATA_ROOT)s/voice-cache",HF_HUB_DISABLE_TELEMETRY="1",GRADIO_ANALYTICS_ENABLED="False"
autostart=true
autorestart=unexpected
startsecs=5
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:jarvis-tools]
priority=30
command=/opt/jarvis-tools/bin/uvicorn app:app --host 127.0.0.1 --port 8090 --no-access-log
directory=/opt/jarvis-tools-app
user=%(ENV_JARVIS_SERVICE_USER)s
environment=HOME="/home/jarvis"
autostart=true
autorestart=unexpected
startsecs=2
startretries=3
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:open-webui]
priority=40
command=/opt/open-webui/bin/open-webui serve --host 0.0.0.0 --port %(ENV_RUNPOD_UI_PORT)s
directory=%(ENV_RUNPOD_DATA_ROOT)s/open-webui
user=%(ENV_JARVIS_SERVICE_USER)s
environment=HOME="/home/jarvis",HF_HOME="%(ENV_RUNPOD_DATA_ROOT)s/open-webui/cache/huggingface"
autostart=true
autorestart=unexpected
startsecs=10
startretries=3
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
