name: Build RunPod image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jarvis-runpod-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Prebuilt llama-server image; leave headroom for Open WebUI/Speaches installs.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          docker system prune --all --force
          df -h

      - name: Set image name
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE_NAME=ghcr.io/${owner}/jarvis-runpod" >> "$GITHUB_ENV"
          echo "PACKAGE_OWNER=${owner}" >> "$GITHUB_ENV"

      - name: Reset private package so republish inherits public visibility
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          # Prefer user package API; fall back to org if needed.
          gh api -X DELETE "/user/packages/container/jarvis-runpod" >/tmp/pkg-delete.json 2>/tmp/pkg-delete.err
          code=$?
          if [[ $code -ne 0 ]]; then
            gh api -X DELETE "/orgs/${{ github.repository_owner }}/packages/container/jarvis-runpod" >/tmp/pkg-delete.json 2>/tmp/pkg-delete.err
            code=$?
          fi
          if [[ $code -eq 0 ]]; then
            echo "Deleted existing jarvis-runpod package for a clean public republish."
          else
            echo "Package delete skipped (may not exist yet):"
            cat /tmp/pkg-delete.err || true
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/runpod/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_NAME }}:0.1.0
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            CUDA_VERSION=12.8.1
            LLAMA_CPP_REF=b12316
            OPEN_WEBUI_VERSION=0.13.3
            SPEACHES_REF=v0.9.0-rc.3
            HUGGINGFACE_HUB_VERSION=2.4.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Packages published from a public repo should inherit public visibility.
          # Explicitly set visibility when the endpoint is available.
          for path in \
            "/user/packages/container/jarvis-runpod" \
            "/orgs/${{ github.repository_owner }}/packages/container/jarvis-runpod"
          do
            if gh api "$path" >/tmp/pkg.json 2>/tmp/pkg.err; then
              visibility=$(jq -r '.visibility // empty' /tmp/pkg.json)
              echo "Package at $path visibility=${visibility}"
              if [[ "$visibility" != "public" ]]; then
                gh api --method PATCH "$path" -f visibility=public \
                  || gh api --method PUT "$path/visibility" -f visibility=public \
                  || true
              fi
              break
            fi
          done
          # Verify anonymous pull of the published tag.
          token=$(curl -fsSL "https://ghcr.io/token?service=ghcr.io&scope=repository:${PACKAGE_OWNER}/jarvis-runpod:pull" | jq -r .token)
          code=$(curl -sS -o /tmp/manifest.json -w "%{http_code}" \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${PACKAGE_OWNER}/jarvis-runpod/manifests/0.1.0")
          echo "Anonymous manifest HTTP ${code}"
          if [[ "$code" != "200" ]]; then
            echo "Package is still not anonymously pullable:"
            cat /tmp/manifest.json || true
            exit 1
          fi